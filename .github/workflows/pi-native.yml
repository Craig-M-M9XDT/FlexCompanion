name: Native Pi build (Python + C++)

on:
  push:
    paths:
      - 'pi-native/**'
      - '.github/workflows/pi-native.yml'
  pull_request:
    paths:
      - 'pi-native/**'
      - '.github/workflows/pi-native.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 shellcheck
      - name: Lint installer
        run: shellcheck pi-native/deploy/install.sh
      - name: Build and install (compiles the C++ core)
        run: |
          python -m pip install -U pip
          python -m pip install "PySide6-Essentials>=6.5" numpy pytest scikit-build-core pybind11
          python -m pip install --no-build-isolation ./pi-native
      - name: C++ core is active
        working-directory: /tmp
        run: python -c "from flexcompanion import _core; assert _core.NATIVE, _core.BACKEND_NAME; print(_core.BACKEND_NAME)"
      - name: Tests (C++ core)
        working-directory: /tmp
        shell: bash
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -rf --tb=short "$GITHUB_WORKSPACE/pi-native/tests" 2>&1 | tee t.txt \
            || { grep -E "^(FAILED|E  )|Error" t.txt | tail -n 25 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }
      - name: Tests (numpy fallback)
        working-directory: /tmp
        shell: bash
        env:
          FLEXCOMPANION_PURE_PYTHON: '1'
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -rf --tb=short "$GITHUB_WORKSPACE/pi-native/tests" 2>&1 | tee t.txt \
            || { grep -E "^(FAILED|E  )|Error" t.txt | tail -n 25 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }

  installer:
    # Runs the real installer in Raspberry Pi OS's base distributions on an ARM64 runner.
    name: Installer · Debian ${{ matrix.debian }} arm64
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          bash pi-native/deploy/install.sh --from "$GITHUB_WORKSPACE/pi-native" 2>&1 | tee install.txt
          if grep -q "C++ core didn't build" install.txt; then
            tail -n 40 install.txt | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
          fi
      - name: Smoke test the installed app
        working-directory: /tmp
        shell: bash
        run: |
          set -o pipefail
          report() { tail -n 40 "$1" | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; }
          V=/opt/flexcompanion-native/venv/bin
          $V/python -m flexcompanion --version 2>&1 | tee out1.txt || { report out1.txt; exit 1; }
          $V/python -c "from flexcompanion import _core; import PySide6; print(_core.BACKEND_NAME, 'PySide6', PySide6.__version__); assert _core.NATIVE" 2>&1 | tee out2.txt || { report out2.txt; exit 1; }
          $V/pip install -q pytest
          $V/python -m pytest -q -p no:cacheprovider -rf --tb=short "$GITHUB_WORKSPACE/pi-native/tests" 2>&1 | tee out3.txt || { report out3.txt; exit 1; }
      - name: Uninstall
        run: bash pi-native/deploy/install.sh --uninstall && test ! -e /opt/flexcompanion-native
