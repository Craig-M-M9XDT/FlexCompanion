name: Retract incomplete PTT preview release
on:
  push:
    branches:
      - chore/retract-ptt-preview-release
    paths:
      - .github/workflows/retract-ptt-preview.yml

permissions:
  contents: write

jobs:
  retract:
    name: Delete v0.6.5 PTT preview release and tag
    runs-on: ubuntu-24.04
    steps:
      - name: Retract published pre-release and its tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.6.5-ptt-preview.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Removed GitHub release and tag: $TAG"
          else
            echo "Release $TAG is already absent; no change required"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The release is still published."
            exit 1
          fi
