name: Publish Flex Control Companion v0.6.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and publish Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish FlexCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/FlexControlCompanion-v0.6.5-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/FlexControlCompanion-v0.6.5-windows-x64.zip
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and publish Raspberry Pi
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Pi/FlexCompanion.Pi.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/pi
          tar -C dist/pi -czf dist/FlexControlCompanion-v0.6.5-pi-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: raspberry-pi
          path: dist/FlexControlCompanion-v0.6.5-pi-arm64.tar.gz
  release:
    needs: [windows, pi]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release-assets/* | sed 's@release-assets/@@' > release-assets/SHA256SUMS.txt
          if gh release view v0.6.5 >/dev/null 2>&1; then
            gh release upload v0.6.5 release-assets/* --clobber
            gh release edit v0.6.5 --title "Flex Control Companion v0.6.5" --notes-file docs/RELEASE-v0.6.5.md --latest
          else
            gh release create v0.6.5 release-assets/* --target "$GITHUB_SHA" --title "Flex Control Companion v0.6.5" --notes-file docs/RELEASE-v0.6.5.md --latest
          fi
