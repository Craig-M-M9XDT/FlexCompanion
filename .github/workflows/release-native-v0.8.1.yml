name: Publish native Raspberry Pi v0.8.1

on:
  push:
    branches: [main]
    paths:
      - 'pi-native/pyproject.toml'
      - 'pi-native/flexcompanion/__init__.py'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Native tests and wheel - ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify intended release version
        shell: bash
        run: |
          grep -q '^version = "0.8.1"$' pi-native/pyproject.toml
          grep -q '^__version__ = "0.8.1"$' pi-native/flexcompanion/__init__.py
      - name: Install Qt libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3
      - name: Compile native extension and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6-Essentials>=6.5" numpy pytest scikit-build-core pybind11
          python -m pip install --no-build-isolation ./pi-native
      - name: Verify compiled C++ core
        working-directory: /tmp
        run: |
          python -c "from flexcompanion import _core; assert _core.NATIVE, _core.BACKEND_NAME"
          python -m flexcompanion --version
      - name: Run full native tests
        working-directory: /tmp
        run: python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/pi-native/tests"
      - name: Run NumPy fallback tests
        working-directory: /tmp
        env:
          FLEXCOMPANION_PURE_PYTHON: '1'
        run: python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/pi-native/tests"
      - name: Build Raspberry Pi ARM64 wheel
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          mkdir -p dist
          python -m pip wheel --no-deps --no-build-isolation ./pi-native --wheel-dir dist
          test "$(find dist -maxdepth 1 -name 'flexcompanion-0.8.1-*.whl' | wc -l)" -eq 1
      - name: Upload ARM64 wheel
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/upload-artifact@v4
        with:
          name: native-pi-081-arm64-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish GitHub release v0.8.1
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-pi-081-arm64-wheel
          path: artifacts
      - name: Build portable source distribution
        shell: bash
        run: |
          mkdir -p bundle/FlexControlCompanion-native-v0.8.1
          cp -a pi-native/. bundle/FlexControlCompanion-native-v0.8.1/
          cp LICENSE NOTICE.md bundle/FlexControlCompanion-native-v0.8.1/
          tar -czf artifacts/FlexControlCompanion-native-v0.8.1-source.tar.gz -C bundle FlexControlCompanion-native-v0.8.1
          cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Publish release (only after all tests pass)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.1 artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Flex Control Companion native Raspberry Pi v0.8.1" \
            --notes-file .github/release-notes-native-v0.8.1.md \
            --latest
