name: Publish FCC PTT preview v0.6.5
run-name: PTT preview v0.6.5-ptt-preview.1

on:
  push:
    branches: ['release/ptt-preview-v0.6.5']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fcc-ptt-preview-v0.6.5
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./FlexCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ./packages -Force | Out-Null
          Compress-Archive -Path ./dist/windows/* -DestinationPath ./packages/FlexControlCompanion-v0.6.5-ptt-preview.1-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FCC-PTT-v0.6.5-Windows
          path: packages/*.zip
          if-no-files-found: error

  raspberry-pi:
    name: Build Raspberry Pi ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Avalonia ARM64 application
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ./Pi/FlexCompanion.Pi.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/pi-arm64
          mkdir -p ./packages
          tar -C ./dist/pi-arm64 -czf ./packages/FlexControlCompanion-v0.6.5-ptt-preview.1-pi-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: FCC-PTT-v0.6.5-RaspberryPi
          path: packages/*.tar.gz
          if-no-files-found: error

  prerelease:
    name: Publish GitHub pre-release
    runs-on: ubuntu-24.04
    needs: [windows, raspberry-pi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FCC-PTT-v0.6.5-*
          merge-multiple: true
          path: release-assets
      - name: SHA256 and package verification
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/FlexControlCompanion-v0.6.5-ptt-preview.1-windows-x64.zip
          test -s release-assets/FlexControlCompanion-v0.6.5-ptt-preview.1-pi-arm64.tar.gz
          unzip -t release-assets/FlexControlCompanion-v0.6.5-ptt-preview.1-windows-x64.zip > /dev/null
          tar -tzf release-assets/FlexControlCompanion-v0.6.5-ptt-preview.1-pi-arm64.tar.gz > /dev/null
          (cd release-assets && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
      - name: Create public GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.5-ptt-preview.1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Increment preview version for subsequent builds."
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Flex Control Companion v0.6.5 — PTT Audio Preview 1" \
            --notes-file RELEASE_NOTES-ptt-preview-v0.6.5.md \
            --prerelease
