name: Licence viewer validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/read-only-license-viewer, feature/licence-dashboard-ptt-select]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile WPF application
        run: dotnet build FlexCompanion.csproj -c Release
      - name: Check licence status parsing
        run: dotnet run --project LicenseTests/LicenseTests.csproj -c Release
      - name: Publish portable Windows preview
        shell: pwsh
        run: |
          dotnet publish FlexCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/preview/* -DestinationPath dist/FlexControlCompanion-Licence-PTT-PrivateTest-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FlexControlCompanion-Licence-PTT-PrivateTest-Windows-x64
          path: dist/FlexControlCompanion-Licence-PTT-PrivateTest-Windows-x64.zip
          retention-days: 14
