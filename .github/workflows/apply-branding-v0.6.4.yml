name: Apply Flex Control Companion branding v0.6.4

on:
  push:
    branches:
      - branding-v0.6.4

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply branding changes
        shell: pwsh
        run: python tools/apply_branding_v064.py
      - name: Validate Windows and Pi builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore .\FlexCompanion.csproj
          dotnet build .\FlexCompanion.csproj -c Release --no-restore
          dotnet restore .\Pi\FlexCompanion.Pi.csproj
          dotnet build .\Pi\FlexCompanion.Pi.csproj -c Release --no-restore
      - name: Commit source branding update
        shell: pwsh
        run: |
          git rm tools/apply_branding_v064.py
          git add -A
          git config user.name "Craig-M-M9XDT"
          git config user.email "craig.magee.1982@gmail.com"
          git commit -m "Rebrand source as Flex Control Companion v0.6.4"
          git push origin HEAD:branding-v0.6.4
